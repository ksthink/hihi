# XcodeGen 프로젝트 정의 — .xcodeproj 는 커밋하지 않고 이 파일에서 재생성한다.
#   생성:  cd ios && node gen-style.mjs && xcodegen generate
#   빌드:  xcodebuild -project ios/HiHeight.xcodeproj -scheme HiHeight -sdk iphonesimulator ...
name: HiHeight
options:
  bundleIdPrefix: dev.metaphr
  deploymentTarget:
    iOS: "17.0"   # 추천 캐러셀 스냅·scrollPosition 등 iOS 17 스크롤 API (테스트 기기 전부 iOS 26)
  createIntermediateGroups: true

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.27.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    minVersion: 2.51.0
    maxVersion: 3.0.0

targets:
  HiHeight:
    type: application
    platform: iOS
    sources:
      - path: HiHeight
        excludes:
          - "Resources/glyphs/**"   # 아래 폴더참조로 별도 추가(구조 보존) — 이중 포함 방지
      # 지도 글리프 pbf — 폴더참조(type: folder)로 <fontstack>/<range>.pbf 디렉터리 구조 보존.
      # (일반 그룹이면 번들 루트로 평탄화돼 range 파일명이 fontstack 간 충돌.)
      - path: HiHeight/Resources/glyphs
        type: folder
    dependencies:
      - package: MapLibre
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.metaphr.hiheight
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
        # 실기기 테스트 · TestFlight 배포 — 자동 서명(배포 인증서/프로파일은
        # xcodebuild -allowProvisioningUpdates 가 App Store Connect API 키로 발급).
        DEVELOPMENT_TEAM: 977YU63XXZ
        CODE_SIGN_STYLE: Automatic
        # 앱 아이콘 — Assets.xcassets/AppIcon.appiconset (1024 단일, scripts/make_app_icon.py 로 생성).
        # ⚠️ 없으면 App Store Connect 가 업로드를 거부한다("Missing app icon").
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: HiHeight/Info.plist
      properties:
        CFBundleDisplayName: 하이하잇
        UILaunchScreen: {}
        # iOS 26 Liquid Glass(플로팅 탭바·블러) opt-out — 배터리 절약 컨셉(글래스/블러 효과 배제).
        # 웹과 동일한 평평·불투명 하단 바 렌더.
        UIDesignRequiresCompatibility: true
        # UI 폰트 — MonaS12 (웹과 동일, 한글+라틴 서브셋 ttf). Font+Kakao.swift 가 웨이트 매핑.
        UIAppFonts:
          - MonaS12.ttf          # Regular
          - MonaS12-Bold.ttf     # Bold
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 모든 트래픽 HTTPS — 타일·팩·config=hihi.metaphr.dev(R2), 날씨=hihi.ksthink.com(Vercel),
        # Supabase 직결, 글리프=앱 번들. HTTP 없음 → arbitrary loads 불필요(App Store 정합).
        # NSAllowsLocalNetworking 은 로컬 dev(localhost 프록시 전환 시)용으로만 유지 — 심사 무관.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 등반 트래킹(M5·IOS.md §7-1) — 화면이 꺼져 있거나 앱을 벗어나도 경로가 끊기지 않게 기록.
        # ⚠️ UIBackgroundModes(location) 가 없으면 allowsBackgroundLocationUpdates 설정이 크래시한다.
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: 등반 중 현재 위치를 지도에 표시하고, 화면이 꺼져 있어도 이동 경로를 계속 기록합니다.
        # 수출 규정 — 통신은 표준 HTTPS(TLS)뿐이라 면제 대상. false 를 박아두면
        # TestFlight/App Store 업로드마다 암호화 설문을 받지 않는다.
        ITSAppUsesNonExemptEncryption: false
