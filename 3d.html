<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하이하잇 — 산 3D 모형 (프로토타입)</title>
<!-- 산 모형 뷰어 프로토타입 — scripts/build_3d.py 가 구운 data/3d/<산코드>/ 자산을 소비.
     ?mnt=<산코드> (기본 북한산) · ?ex=수직과장(기본 1.3)
     ⚠️ 웹 전용 프로토타입: three.js CDN ESM (iOS 는 같은 자산을 SceneKit 으로 읽는 계획) -->
<style>
  html, body { margin: 0; height: 100%; background: #ececec; overflow: hidden; }
  #c { position: fixed; inset: 0; touch-action: none; }
  #hud {
    position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; z-index: 2;
    font: 14px/1.45 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #111; pointer-events: none;
  }
  #hud b { font-size: 19px; }
  #hud .dim { color: #767676; font-size: 12px; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
         color: #767676; font: 13px -apple-system, sans-serif; z-index: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="msg">모형 준비 중…</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const q = new URLSearchParams(location.search);
const CODE = q.get("mnt") || "113050202";
const EX = Math.max(0.5, Math.min(3, parseFloat(q.get("ex")) || 1.3));
const msg = (t) => { document.getElementById("msg").textContent = t || ""; };

// terrain-RGB PNG → 높이 배열 (build_3d.py 인코딩의 역변환)
async function loadHeights(url, n) {
  const img = new Image();
  img.src = url;
  await img.decode();
  const cv = document.createElement("canvas");
  cv.width = cv.height = n;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, n, n);
  const d = ctx.getImageData(0, 0, n, n).data;
  const h = new Float32Array(n * n);
  for (let i = 0; i < n * n; i++)
    h[i] = -10000 + (d[i * 4] * 65536 + d[i * 4 + 1] * 256 + d[i * 4 + 2]) * 0.1;
  return h;
}

async function main() {
  const meta = await fetch(`data/3d/${CODE}/meta.json`).then((r) => {
    if (!r.ok) throw new Error(`자산 없음 — scripts/build_3d.py ${CODE} 를 먼저 실행하세요`);
    return r.json();
  });
  const n = meta.grid;
  const [heights, tex] = await Promise.all([
    loadHeights(`data/3d/${CODE}/height.png`, n),
    new THREE.TextureLoader().loadAsync(`data/3d/${CODE}/texture.png`),
  ]);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;

  const [w, h] = meta.size_m;
  const geo = new THREE.PlaneGeometry(w, h, n - 1, n - 1); // XY 평면, 행 0 = 북쪽(위)
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setZ(i, heights[i] * EX);
  geo.computeVertexNormals();

  // 음영은 텍스처에 구워져 있음 → 무조명 재질(흑백 카토그래피 그대로)
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex }));
  mesh.rotation.x = -Math.PI / 2;                 // z-up → y-up (북쪽 = -z)
  const midH = (meta.elev_min + meta.elev_max) / 2 * EX;

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xececec);
  scene.add(mesh);

  const cam = new THREE.PerspectiveCamera(55, 1, 10, w * 10);
  cam.position.set(0, w * 0.55, h * 0.75);        // 남쪽 상공에서 시작
  const ctl = new OrbitControls(cam, renderer.domElement);
  ctl.target.set(0, midH, 0);
  ctl.enableDamping = true;
  ctl.dampingFactor = 0.08;
  ctl.maxPolarAngle = Math.PI * 0.495;             // 지면 아래로는 안 내려감
  ctl.minDistance = w * 0.08;
  ctl.maxDistance = w * 2.2;
  ctl.autoRotate = true;                           // 첫 조작 전까지 천천히 회전
  ctl.autoRotateSpeed = 0.7;
  ctl.addEventListener("start", () => { ctl.autoRotate = false; });

  const resize = () => {
    renderer.setSize(innerWidth, innerHeight);
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
  };
  addEventListener("resize", resize);
  resize();

  document.getElementById("hud").innerHTML =
    `<b>${meta.name}</b> <span class="dim">${meta.elev ? meta.elev + "m" : ""}</span><br>` +
    `<span class="dim">드래그 회전 · 휠/핀치 줌 · 두 손가락 이동 — 수직 ×${EX}</span>`;
  msg("");

  renderer.setAnimationLoop(() => { ctl.update(); renderer.render(scene, cam); });
  window.__scene3d = { renderer, mesh, meta };     // 헤드리스 검증 훅
}

main().catch((e) => msg("로드 실패: " + e.message));
</script>
</body>
</html>
