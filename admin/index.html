<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>하이하잇 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.min.css" />
<link rel="stylesheet" href="./admin.css" />
</head>
<body>
<!-- 로그인 게이트: /api 401 시 표시 (비밀번호 → 토큰 발급, 5회 실패 시 10분 잠금) -->
<div id="login-overlay" hidden>
  <form id="login-form">
    <h1>하이하잇 관리자</h1>
    <input id="login-pw" type="password" placeholder="비밀번호" autocomplete="current-password" autofocus />
    <button type="submit" class="primary big">입장</button>
    <div id="login-msg"></div>
  </form>
</div>

<aside id="side">
  <header id="side-head">
    <h1>하이하잇 관리자</h1>
    <span class="head-right">
      <span id="save-state" title="draft 저장 상태"></span>
      <button id="logout" title="이 브라우저의 인증을 지우고 나갑니다">로그아웃</button>
    </span>
  </header>

  <!-- 산 검색/추가 -->
  <section id="sec-search">
    <input id="mnt-q" type="search" placeholder="산 이름·산코드 검색 (전국 5,360)" autocomplete="off" />
    <ul id="mnt-results" hidden></ul>
  </section>

  <!-- 초안 목록 -->
  <section id="sec-list">
    <h2>관리 중인 산</h2>
    <ul id="draft-list"></ul>
  </section>

  <!-- 선택 산 편집 -->
  <section id="sec-mnt" hidden>
    <h2 id="mnt-title"></h2>

    <div class="mnt-meta">
      <label>지역 <input id="m-region" /></label>
      <label>높이(m) <input id="m-elev" type="number" /></label>
      <label>정렬 <input id="m-sort" type="number" /></label>
      <label class="chk"><input id="m-famous" type="checkbox" /> 100대 명산(추천 노출)</label>
      <label class="chk"><input id="m-published" type="checkbox" /> 공개(앱 노출)</label>
    </div>

    <h3>코스 <span id="course-count"></span></h3>
    <ul id="course-list"></ul>

    <div class="gpx-box">
      <h3>GPX 코스 추가</h3>
      <div class="row">
        <label>스냅(m) <input id="gpx-tau" type="number" value="25" /></label>
        <label>우회비 <input id="gpx-detour" type="number" step="0.1" value="1.6" /></label>
      </div>
      <input id="gpx-file" type="file" accept=".gpx" />
      <div id="gpx-report" hidden></div>
      <div class="row" id="gpx-actions" hidden>
        <button id="gpx-accept" class="primary">코스로 추가</button>
        <button id="gpx-rematch">재매칭</button>
        <button id="gpx-cancel">버리기</button>
      </div>
    </div>

    <h3>스팟 <span id="spot-count"></span></h3>
    <div class="row">
      <button id="spot-add">＋ 스팟 추가 (지도 클릭)</button>
      <label class="chk"><input id="spot-show-del" type="checkbox" /> 삭제된 것 표시</label>
    </div>
    <div id="spot-editor" hidden>
      <div class="row"><b id="sp-cat-label"></b><span id="sp-id" class="dim"></span></div>
      <label>이름(앱 지도 라벨 — 비우면 미노출) <input id="sp-name" placeholder="예: 매봉 갈림길" /></label>
      <label>분류
        <select id="sp-cat">
          <option>분기점</option><option>시종점</option><option>정상</option>
          <option>조망점</option><option>음수대</option><option>화장실</option>
          <option>정자</option><option>주차장</option><option>헬기장</option>
        </select>
      </label>
      <div class="dim" id="sp-detail"></div>
      <div class="row">
        <button id="sp-del" class="danger">삭제</button>
        <button id="sp-close">닫기</button>
      </div>
      <p class="dim">위치 이동: 지도에서 스팟을 드래그</p>
    </div>

    <div class="publish-box">
      <button id="publish" class="primary big">배포 (Supabase 반영)</button>
      <div id="pub-info" class="dim"></div>
      <div id="job-panel" hidden>
        <div id="job-step"></div>
        <div class="pbar"><div id="job-fill"></div></div>
        <pre id="job-log"></pre>
      </div>
      <div class="row">
        <button id="draft-del" class="danger">초안 제거 (로컬만)</button>
      </div>
      <p class="dim">배포된 산을 앱에서 내리려면 삭제가 아니라 "공개" 체크 해제 후 배포.</p>
    </div>
  </section>
</aside>

<main id="map"></main>
<script type="module" src="./admin.js"></script>
</body>
</html>
